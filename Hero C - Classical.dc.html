<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#e7eef6; }
  body { font-family:'Geist', system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  * { box-sizing:border-box; }
  a { color:inherit; text-decoration:none; }
</style>
</helmet>

<div style="position:relative;width:100%;height:100vh;min-height:420px;overflow:hidden;background:linear-gradient(186deg,#fbfdff 0%,#eff5fb 44%,#dde8f4 100%)">
  <div aria-hidden="true" style="position:absolute;inset:0;filter:blur(46px);background:radial-gradient(38% 30% at 18% 22%, rgba(154,196,240,0.5), transparent 70%), radial-gradient(42% 32% at 82% 30%, rgba(198,214,240,0.55), transparent 72%), radial-gradient(60% 40% at 50% 108%, rgba(126,168,214,0.42), transparent 74%)"></div>

  <div style="position:absolute;inset:0;display:grid;align-content:center;justify-items:center;padding:56px 8vw 104px">
    <p style="margin:0 0 10px;color:rgba(18,40,70,0.46);font-family:'Geist Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.5em;text-transform:uppercase;text-indent:0.5em">Hi, I'm</p>
    <h1 style="display:block;width:100%;margin:0;text-align:center;font-family:'Instrument Serif',Georgia,serif;font-size:min(15vw,23vh,214px);font-weight:400;letter-spacing:-0.022em;line-height:0.94;color:#122846">Thribhuvan</h1>
    <p style="margin:18px 0 0;max-width:46ch;text-align:center;color:rgba(18,40,70,0.58);font-size:15.5px;font-weight:500;line-height:1.55;text-wrap:balance">Full-stack engineer. I build products end to end, and send fixes back upstream.</p>
  </div>

  <div aria-hidden="true" style="position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center">
    <div style="display:flex;gap:8px;padding:7px;border:1px solid rgba(255,255,255,0.8);border-radius:22px;background:rgba(255,255,255,0.44);box-shadow:0 20px 46px rgba(14,38,70,0.18);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%)">
      <span style="width:46px;height:46px;border-radius:12px;background:linear-gradient(160deg,#f6ead4,#c9a56b)"></span>
      <span style="width:46px;height:46px;border-radius:12px;background:linear-gradient(160deg,#ffe9a8,#d9a93a)"></span>
      <span style="width:46px;height:46px;border-radius:12px;background:linear-gradient(160deg,#a8d4f6,#2f86cc)"></span>
      <span style="width:46px;height:46px;border-radius:12px;background:linear-gradient(160deg,#4c545e,#14181d)"></span>
      <span style="width:46px;height:46px;border-radius:12px;background:linear-gradient(160deg,#4bef8e,#12a147)"></span>
    </div>
  </div>
</div>

</x-dc>
</body>
</html>
