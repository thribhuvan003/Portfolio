<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio responsive check</title>
<style>
body { margin: 0; padding: 16px; font: 14px system-ui; background: #d9dde2; }
nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
button { padding: 10px 14px; cursor: pointer; }
iframe { display: block; border: 1px solid #777; background: white; width: 390px; height: 844px; }
</style>
<nav aria-label="Preview size">
<button type="button" data-width="360" data-height="740">360px phone</button>
<button type="button" data-width="390" data-height="844">390px phone</button>
<button type="button" data-width="430" data-height="932">430px phone</button>
<button type="button" data-width="844" data-height="390">Landscape phone</button>
</nav>
<iframe title="Portfolio preview" src="../index.html"></iframe>
<script>
document.querySelectorAll('button').forEach((button) => {
  button.addEventListener('click', () => {
    const frame = document.querySelector('iframe');
    frame.style.width = button.dataset.width + 'px';
    frame.style.height = button.dataset.height + 'px';
  });
});
</script>
</html>
